# Builds packages when a release is published (or for an existing release,
# run by hand) and attaches them to the release, then has rpajarola/apt
# rebuild the apt repository and points the Homebrew formula at the
# release. See packaging/README.md for the one-time setup.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build packages for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz" |
            sudo tar xzf - -C /usr/local/bin nfpm
      - name: Build
        run: VERSION="${TAG#v}" packaging/build-deb.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb --clobber

  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: VERSION="${TAG#v}" packaging/build-pkg.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.pkg --clobber

  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "PACKAGES_TOKEN is not set; skipping"
            exit 0
          fi
          packaging/update-tap.sh mirrortools "$TAG"

  apt:
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - name: Have rpajarola/apt rebuild the apt repository
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PACKAGES_TOKEN is not set; run the publish workflow in rpajarola/apt by hand"
            exit 0
          fi
          gh api repos/rpajarola/apt/dispatches -f event_type=release \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" -f "client_payload[tag]=$TAG"
